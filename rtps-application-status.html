<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening RTPS Application Status</title>
</head>
<body>
  <form id="statusForm" method="post" action="https://serviceonline.bihar.gov.in/officials/citizenApplication.html">
    <noscript>
      <p>JavaScript is required to open the RTPS application status page.</p>
      <button type="submit">Open RTPS Application Status</button>
    </noscript>
  </form>
  <script>
    document.getElementById("statusForm").submit();
  </script>
</body>
</html>
